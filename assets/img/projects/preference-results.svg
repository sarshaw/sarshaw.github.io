      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1100" height="500" rx="12" fill="url(#bg3)"/>
  
  <text x="550" y="38" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="3">KEY FINDINGS: OVERALL PREFERENCE BY AUTHOR SOURCE</text>
  
  <!-- Chart area -->
