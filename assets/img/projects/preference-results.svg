  <text x="680" y="158" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="bold">27.4%</text>
  
  <!-- Legend -->
  <rect x="760" y="80" width="300" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <rect x="780" y="105" width="14" height="14" rx="2" fill="#f59e0b" opacity="0.85"/>
  <text x="802" y="116" fill="#cbd5e1" font-size="11">Human Curriculum Designers</text>
  <rect x="780" y="130" width="14" height="14" rx="2" fill="#8b5cf6" opacity="0.85"/>
