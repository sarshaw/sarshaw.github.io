  <text x="500" y="151" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="bold">29.0%</text>
  
  <!-- High School group -->
  <text x="630" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">High School</text>
