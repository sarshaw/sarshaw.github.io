  <text x="780" y="265" fill="#cbd5e1" font-size="10">For cool-down activities, GPT-4 was</text>
  <text x="780" y="280" fill="#cbd5e1" font-size="10">preferred 59.7% over human plans.</text>
  <text x="780" y="298" fill="#94a3b8" font-size="9">AI excels at structured wrap-up tasks.</text>

  <!-- Insight boxes at bottom -->
  <rect x="40" y="340" width="330" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="60" y="370" fill="#f59e0b" font-size="11" font-weight="bold">Why educators chose Human plans</text>
  <text x="60" y="394" fill="#94a3b8" font-size="10">• Nuanced differentiation for diverse learners</text>
  <text x="60" y="412" fill="#94a3b8" font-size="10">• Real-world contextualization</text>
  <text x="60" y="430" fill="#94a3b8" font-size="10">• Student discourse facilitation</text>
  <text x="60" y="448" fill="#94a3b8" font-size="10">• Scaffolding and collaborative structures</text>
  
  <rect x="390" y="340" width="330" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="410" y="370" fill="#8b5cf6" font-size="11" font-weight="bold">Why educators chose AI plans</text>
  <text x="410" y="394" fill="#94a3b8" font-size="10">• Clear structure and organization</text>
  <text x="410" y="412" fill="#94a3b8" font-size="10">• Adaptability for specific tasks</text>
  <text x="410" y="430" fill="#94a3b8" font-size="10">• Efficient cool-down activities</text>
  <text x="410" y="448" fill="#94a3b8" font-size="10">• Consistent formatting</text>
  
  <rect x="740" y="340" width="320" height="130" rx="8" fill="#1e293b" stroke="#0d9488" stroke-width="1"/>
  <text x="760" y="370" fill="#0d9488" font-size="11" font-weight="bold">Design Implication</text>
  <text x="760" y="394" fill="#cbd5e1" font-size="10">AI generates structured drafts;</text>
  <text x="760" y="412" fill="#cbd5e1" font-size="10">humans refine and customize.</text>
  <text x="760" y="436" fill="#94a3b8" font-size="10">This directly shaped the platform's</text>
  <text x="760" y="454" fill="#94a3b8" font-size="10">human-AI collaborative design philosophy.</text>
