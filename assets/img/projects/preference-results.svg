  <line x1="120" y1="158" x2="700" y2="158" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="120" y1="200" x2="700" y2="200" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="120" y1="242" x2="700" y2="242" stroke="#1e293b" stroke-width="0.5"/>
  
  <!-- Overall group -->
  <text x="250" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">Overall</text>
  <!-- Human: 42.1% -->
