  <rect x="230" y="165" width="40" height="115" rx="3" fill="#8b5cf6" opacity="0.85"/>
  <text x="250" y="158" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="bold">27.3%</text>
